<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes - IronPump</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="container py-4" id="det"></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let e;

function refresh() {
  det.innerHTML = `<a href="index.html" class="small">← Voltar</a>
  <div class="row g-4 mt-1">
    <div class="col-md-6"><img src="${esc(e.imagem)}" class="img-fluid rounded" alt="${esc(e.titulo)}"></div>
    <div class="col-md-6">
      <h2>${esc(e.titulo)} <button class="btn btn-dark" onclick="toggleFav('${e.id}')">${heart(e.id)}</button></h2>
      <p><span class="badge text-bg-warning">${esc(e.grupo)}</span> <span class="badge text-bg-secondary">${esc(e.nivel)}</span></p>
      <p>${esc(e.descricao)}</p>
      <ul class="list-group mb-3">
        <li class="list-group-item">Equipamento: ${esc(e.equipamento)}</li>
        <li class="list-group-item">Séries: ${esc(e.series)}</li>
        <li class="list-group-item">Repetições: ${esc(e.repeticoes)}</li>
      </ul>
      <div class="alert alert-warning"><b>Dica de execução:</b> ${esc(e.dica)}</div>
    </div>
  </div>`;
}

navbar();
get('/exercicios/' + id).then(d => { e = d; refresh(); }).catch(() => det.innerHTML = '<p>Exercício não encontrado.</p>');
</script>
</body>
</html>
