<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta - IronPump</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="container py-5" style="max-width:420px">
  <h2>Criar conta</h2>
  <form id="f">
    <input id="nome" class="form-control mb-2" placeholder="Nome completo" required>
    <input id="email" type="email" class="form-control mb-2" placeholder="E-mail" required>
    <input id="login" class="form-control mb-2" placeholder="Login" required>
    <input id="senha" type="password" class="form-control mb-2" placeholder="Senha" required>
    <div id="erro" class="text-danger small mb-2"></div>
    <button class="btn btn-warning w-100">Cadastrar</button>
  </form>
  <p class="mt-3">Já tem conta? <a href="login.html">Entrar</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
navbar();
f.onsubmit = async ev => {
  ev.preventDefault();
  if ((await get('/usuarios?login=' + encodeURIComponent(login.value))).length) { erro.textContent = 'Esse login já está em uso.'; return; }
  await send('/usuarios', 'POST', {id: crypto.randomUUID(), login: login.value, senha: senha.value, nome: nome.value, email: email.value, admin: false, favoritos: []});
  alert('Conta criada! Faça login.');
  location = 'login.html';
};
</script>
</body>
</html>
