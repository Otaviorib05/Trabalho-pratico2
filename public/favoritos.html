<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favoritos - IronPump</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">
  <h2 class="mb-3">Meus favoritos</h2>
  <div class="row g-3" id="cards"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
if (!usuario()) location = 'login.html';
navbar();

async function refresh() {
  const todos = await get('/exercicios');
  const f = usuario().favoritos.map(String);
  cards.innerHTML = todos.filter(e => f.includes(String(e.id))).map(card).join('')
    || '<p class="text-secondary">Você ainda não favoritou nenhum exercício. Toque no coração em um card na Home.</p>';
}
refresh();
</script>
</body>
</html>
