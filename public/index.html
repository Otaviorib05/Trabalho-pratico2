<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronPump</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="container py-4">

<section class="mb-5">
  <h2 class="mb-3">Exercícios em destaque</h2>
  <div id="car" class="carousel slide">
    <div class="carousel-inner" id="slides"></div>
    <button class="carousel-control-prev" data-bs-target="#car" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
    <button class="carousel-control-next" data-bs-target="#car" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
  </div>
</section>

<section class="mb-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h2 class="m-0">Todos os exercícios</h2>
    <form id="busca" class="d-flex gap-2">
      <input id="q" class="form-control" placeholder="Buscar por nome ou descrição">
      <button class="btn btn-warning">Buscar</button>
    </form>
  </div>
  <div class="row g-3" id="cards"></div>
</section>

<section class="mb-5">
  <h2 class="mb-3">Exercícios por grupo muscular</h2>
  <div style="max-height:360px"><canvas id="grafico"></canvas></div>
</section>

<section class="mb-5">
  <h2 class="mb-3">Otávio</h2>
  <div class="card p-3">
    <div class="d-flex gap-3 align-items-center flex-wrap">
      <img src="https://placehold.co/120x120/ffc107/1c1c1c?text=Foto" class="rounded-circle" width="120" height="120" alt="Foto do autor">
      <div>
    </div>
  </div>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
let todos = [], termo = '';

function refresh() {
  const t = termo.toLowerCase();
  const lista = todos.filter(e => !t || e.titulo.toLowerCase().includes(t) || e.descricao.toLowerCase().includes(t));
  document.getElementById('cards').innerHTML = lista.map(card).join('') || '<p class="text-secondary">Nenhum exercício encontrado.</p>';
}

document.getElementById('busca').onsubmit = ev => {
  ev.preventDefault();
  termo = document.getElementById('q').value.trim();
  refresh();
};
document.getElementById('q').oninput = ev => {
  if (!ev.target.value) { termo = ''; refresh(); }
};

navbar();
get('/exercicios').then(d => {
  todos = d;
  refresh();

  document.getElementById('slides').innerHTML = d.filter(e => e.destaque).map((e, i) => `<div class="carousel-item ${i ? '' : 'active'}">
    <a href="detalhes.html?id=${e.id}"><img src="${esc(e.imagem)}" class="d-block w-100" style="max-height:420px;object-fit:cover" alt="${esc(e.titulo)}">
    <div class="carousel-caption bg-dark bg-opacity-75 rounded"><h5>${esc(e.titulo)}</h5><p class="mb-0">${esc(e.descricao)}</p></div></a></div>`).join('');

  const g = {};
  d.forEach(e => g[e.grupo] = (g[e.grupo] || 0) + 1);
  new Chart(document.getElementById('grafico'), {
    type: 'bar',
    data: {labels: Object.keys(g), datasets: [{label: 'Exercícios cadastrados', data: Object.values(g), backgroundColor: '#ffc107'}]},
    options: {maintainAspectRatio: false, scales: {y: {beginAtZero: true, ticks: {stepSize: 1}}}}
  });
}).catch(() => document.getElementById('cards').innerHTML = '<p class="text-danger">Inicie o JSON Server (npx json-server --watch db/db.json).</p>');
</script>
</body>
</html>
