<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - IronPump</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="container py-5" style="max-width:420px">
  <h2>Entrar</h2>
  <form id="f">
    <input id="login" class="form-control mb-2" placeholder="Login" required>
    <input id="senha" type="password" class="form-control mb-2" placeholder="Senha" required>
    <div id="erro" class="text-danger small mb-2"></div>
    <button class="btn btn-warning w-100">Entrar</button>
  </form>
  <p class="mt-3">Ainda não tem conta? <a href="registro.html">Cadastre-se</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
navbar();
f.onsubmit = async ev => {
  ev.preventDefault();
  const r = await get('/usuarios?login=' + encodeURIComponent(login.value) + '&senha=' + encodeURIComponent(senha.value));
  if (!r.length) { erro.textContent = 'Login ou senha incorretos.'; return; }
  sessionStorage.setItem('usuario', JSON.stringify(r[0]));
  location = 'index.html';
};
</script>
</body>
</html>
